<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="БАЗА">
<meta name="theme-color" content="#0b0c0e">
<meta name="format-detection" content="telephone=no">
<title>БАЗА</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#0b0c0e;--card:#16181c;--card2:#1d2025;--line:#2a2e35;--text:#f2f3f5;--muted:#8e939c;--dim:#5c616a;
  --acc:#c6ff3d;--accT:#0b0c0e;--k:#ffb54a;--p:#4fd1ff;--f:#ff7d6e;--c:#b896ff;--ok:#52e08a;--bad:#ff5a5a;--warn:#ffc547;
  --r:20px;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(84px + var(--sab));overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
input,textarea,select{font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;min-height:52px;outline:none;-webkit-appearance:none;appearance:none}
input:focus,textarea:focus{border-color:var(--acc)}
textarea{resize:none;min-height:52px}
.hdr{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 85%,rgba(11,12,14,0));padding:calc(var(--sat) + 8px) 14px 10px}
.top{display:flex;align-items:center;justify-content:space-between;height:40px}
.brand{font-weight:900;letter-spacing:.14em;font-size:20px}
.brand small{font-weight:600;letter-spacing:0;color:var(--muted);font-size:15px;margin-left:8px}
.gear{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--muted);font-size:22px}
.ai{margin-top:6px;background:linear-gradient(135deg,#1b2112,#15181c 60%);border:1px solid #33401b;border-radius:var(--r);padding:12px 14px;position:relative}
.ai .lbl{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--acc);text-transform:uppercase;display:flex;justify-content:space-between}
.ai .lbl span{color:var(--muted);letter-spacing:.02em;font-weight:600;text-transform:none}
.ai .l{font-size:15.5px;line-height:1.3;margin-top:3px}
.ai .l b{color:var(--acc);font-weight:700}
.ai .l.warn{color:var(--warn)} .ai .l.bad{color:#ff8a7a}
.hdr.compact .ai .l:nth-child(n+4){display:none}
.wrap{padding:4px 14px 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:12px}
.card h3{margin:0 0 10px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 .act{letter-spacing:0;text-transform:none;color:var(--acc);font-size:15px;font-weight:700;min-height:36px;padding:0 4px}
.mut{color:var(--muted)} .dim{color:var(--dim)} .sm{font-size:14px} .xs{font-size:12.5px}
.row{display:flex;align-items:center;gap:10px} .sp{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.btn{min-height:54px;border-radius:16px;padding:0 18px;font-weight:700;background:var(--card2);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--acc);color:var(--accT);border-color:var(--acc)}
.btn.full{width:100%}
.btn.ghost{background:transparent}
.btn.red{color:#ff8a7a}
.btn:active{transform:scale(.98);opacity:.9}
.bar{height:12px;border-radius:8px;background:#262a31;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:8px}
.bar .cor{position:absolute;top:0;bottom:0;border-left:2px solid rgba(255,255,255,.35);border-right:2px solid rgba(255,255,255,.35)}
.mac{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.mac .t{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:700;margin-bottom:6px}
.mac .n{font-size:15px;font-weight:700;margin-top:6px;white-space:nowrap}
.mac .n em{font-style:normal;color:var(--muted);font-weight:600}
.chk{display:flex;align-items:center;gap:14px;min-height:58px;width:100%;text-align:left;padding:6px 2px}
.box{width:32px;height:32px;border-radius:10px;border:2px solid #444a53;flex:none;display:grid;place-items:center;font-weight:900;font-size:18px;color:var(--accT)}
.on .box,.box.on{background:var(--acc);border-color:var(--acc)}
.chk .tx{flex:1}
.chk .tx small{display:block;color:var(--muted);font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:13.5px;font-weight:700;background:var(--card2);border:1px solid var(--line);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:#24533a;background:#11251a}
.pill.no{color:var(--warn);border-color:#4b3d17;background:#221c0c}
.lines .ln{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.lines .ln:first-of-type{border-top:0;padding-top:0}
.lines .num{width:26px;height:26px;border-radius:8px;background:var(--card2);display:grid;place-items:center;font-size:14px;font-weight:800;color:var(--acc);flex:none;margin-top:1px}
.lines .k{font-size:13px;color:var(--muted);font-weight:700}
.stat{background:var(--card2);border-radius:16px;padding:12px}
.stat .k{font-size:13px;color:var(--muted);font-weight:700}
.stat .v{font-size:24px;font-weight:800;margin-top:2px}
.stat .v small{font-size:14px;color:var(--muted);font-weight:600}
.ex{border-top:1px solid var(--line);padding:12px 0}
.ex:first-of-type{border-top:0;padding-top:2px}
.ex .nm{font-weight:800;font-size:18px}
.ex .meta{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.ex .how{color:var(--muted);font-size:14.5px}
.sets{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.set{width:54px;height:54px;border-radius:16px;border:2px solid #3a3f47;font-weight:800;font-size:17px;color:var(--muted)}
.set.on{background:var(--acc);border-color:var(--acc);color:var(--accT)}
.ex.done .nm::after{content:" ✓";color:var(--acc)}
.days{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.dchip{flex:1;min-width:44px;height:54px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-weight:800;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.dchip small{font-size:10.5px;color:var(--muted);font-weight:700}
.dchip.sel{border-color:var(--acc);color:var(--acc)}
.dchip.today{background:#232a14}
.food{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.food img{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:none}
.food .nm{font-weight:700}
.food .m{font-size:13.5px;color:var(--muted)}
.food .kc{font-weight:800;white-space:nowrap}
.meal-h{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin:14px 0 2px}
.meal-h:first-of-type{margin-top:0}
.plan{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.plan:first-of-type{border-top:0}
.plan .nm{font-weight:700}
.plan .m{font-size:13.5px;color:var(--muted)}
.plan .eat{min-height:48px;min-width:76px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-weight:800;font-size:15px;padding:0 10px}
.plan .eat.done{color:var(--ok);border-color:#24533a;background:#11251a}
.rule{background:#1a1d12;border:1px solid #2f3a17;border-radius:14px;padding:10px 12px;font-size:14.5px;color:#d9e6b8;margin-top:10px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(14,15,18,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:6px 8px calc(6px + var(--sab))}
.tab{height:62px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px;font-weight:700;color:var(--muted)}
.tab svg{width:26px;height:26px}
.tab.on{color:var(--acc)}
.fab{position:fixed;right:14px;bottom:calc(92px + var(--sab));z-index:25;display:flex;gap:10px}
.fab button{height:60px;min-width:60px;border-radius:20px;background:var(--acc);color:var(--accT);font-weight:800;font-size:17px;padding:0 18px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.fab button.sec{background:#262a31;color:var(--text);border:1px solid #3a3f47}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:#121418;border-top-left-radius:26px;border-top-right-radius:26px;border-top:1px solid var(--line);max-height:92vh;overflow-y:auto;padding:10px 16px calc(18px + var(--sab));transform:translateY(105%);visibility:hidden;transition:transform .25s ease,visibility 0s .25s;-webkit-overflow-scrolling:touch}
.sheet.open{transform:none;visibility:visible;transition:transform .25s ease}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:#3a3f47;margin:0 auto 10px}
.sheet h2{margin:2px 0 12px;font-size:22px}
.fld{margin-top:10px}
.fld label{display:block;font-size:13.5px;color:var(--muted);font-weight:700;margin:0 0 5px 2px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{min-height:48px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:700;font-size:15px}
.seg button.on{background:var(--acc);color:var(--accT);border-color:var(--acc)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;min-height:44px;padding:0 14px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-weight:700;font-size:15px}
.chips button.on{border-color:var(--acc);color:var(--acc)}
.toast{position:fixed;left:14px;right:14px;bottom:calc(96px + var(--sab));z-index:60;background:#22262d;border:1px solid #3a3f47;border-radius:16px;padding:12px 14px;display:none;align-items:center;gap:10px;font-weight:600}
.toast button{color:var(--acc);font-weight:800;min-height:40px;padding:0 6px}
.timer{position:fixed;left:14px;right:14px;bottom:calc(96px + var(--sab));z-index:40;background:#1b2112;border:1px solid #33401b;border-radius:18px;padding:10px 14px;display:none;align-items:center;gap:12px}
.timer .tt{font-size:28px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--acc)}
.chart{width:100%;height:auto;display:block;margin-top:6px}
.photo-prev{width:100%;max-height:260px;object-fit:cover;border-radius:16px;margin-bottom:10px}
.res .whatline{font-size:19px;font-weight:800}
.note{font-size:14px;color:var(--muted);margin-top:8px}
.spinner{width:22px;height:22px;border:3px solid #3a3f47;border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.water{display:flex;gap:4px;margin:10px 0 4px}
.water i{flex:1;height:26px;border-radius:7px;background:#262a31}
.water i.on{background:var(--p)}
.water i.ok{outline:1px dashed #4fd1ff66}
.tag{font-size:12px;font-weight:800;padding:3px 8px;border-radius:8px;background:var(--card2);color:var(--muted);letter-spacing:0;text-transform:none}
.tag.opt{color:var(--c)}
.hidden{display:none!important}

/* ===== v2: дизайн-система ===== */
body{background:radial-gradient(120% 60% at 50% -10%,#1a2210 0%,#0b0c0e 55%) fixed,#0b0c0e}
.card{background:linear-gradient(180deg,#181b20,#141619);border:1px solid #262a31;box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.03);border-radius:22px;padding:16px;margin-top:14px}
.ic{width:20px;height:20px;flex:none;vertical-align:middle}
.ic.i14{width:15px;height:15px;margin-top:-2px}
.sh{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.shi{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none;background:linear-gradient(135deg,#2a3516,#1b2010);color:var(--acc);border:1px solid #34421a}
.shi .ic{width:19px;height:19px}
.sht{font-weight:800;font-size:17px;letter-spacing:-.01em}
.shd{font-size:13.5px;color:var(--muted);margin-top:2px;line-height:1.35}
.sh .act{color:var(--acc);font-weight:700;font-size:15px;min-height:40px;padding:0 4px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.act{color:var(--acc);font-weight:700;font-size:15px;min-height:40px;padding:0 4px;display:inline-flex;align-items:center;gap:4px}
.big2{font-size:22px;font-weight:900;color:var(--acc)}
.lnk{color:var(--acc);font-weight:700;font-size:inherit;padding:0;text-decoration:underline;text-underline-offset:3px}
.gear{color:var(--muted)} .gear .ic{width:22px;height:22px}
.top{gap:8px}.top .brand{flex:1}
.lvchip{display:flex;align-items:center;gap:3px;height:36px;padding:0 12px;border-radius:999px;background:linear-gradient(135deg,#2a3516,#1a1f10);border:1px solid #3d4f1c;color:var(--acc);font-weight:800}
.lvchip .ic{width:16px;height:16px}.lvchip b{font-size:17px}.lvchip span{font-size:12px;color:var(--muted);font-weight:700}
.btn .ic{width:20px;height:20px}
.btn.sm2{min-height:46px;margin-top:10px}
.hint{background:linear-gradient(135deg,#1c2412,#15181c);border:1px dashed #4a5f22;border-radius:20px;padding:14px;margin-top:6px}
.hint ol{margin:10px 0 0;padding-left:22px;font-size:14.5px;line-height:1.45;color:#dfe7cc}.hint li{margin:4px 0}
.hint .hx{width:40px;height:40px;display:grid;place-items:center;color:var(--muted)}
.empty{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:14.5px;background:#121418;border:1px dashed #2f343c;border-radius:14px;padding:12px}
.empty .ic{color:#4a505a;margin-top:1px}
/* герой */
.hero{background:radial-gradient(90% 70% at 25% 40%,#1f2a10 0%,#15181c 70%);border-color:#2f3b19;overflow:hidden}
.figbox{width:150px;flex:none;position:relative}
.fig{width:150px;height:auto;display:block}
.fig .shorts{fill:#262c36;stroke:#3a4250;stroke-width:1.5}
.fig .hair{fill:#11140c}
.fig .aura{animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.figpct{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-weight:900;font-size:13px;color:var(--acc);letter-spacing:.05em}
.herocol{padding-top:6px;min-width:0}
.lvl{display:flex;align-items:center;gap:10px}
.lvn{font-size:46px;font-weight:900;line-height:1;background:linear-gradient(180deg,#eaffb0,#8fd11a);-webkit-background-clip:text;background-clip:text;color:transparent;min-width:34px}
.lvt{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.1em}
.rank{font-weight:800;font-size:18px}
.xpbar{height:10px;border-radius:6px;background:#23272e;overflow:hidden;margin:10px 0 5px}
.xpbar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#7dbb12,#c6ff3d);box-shadow:0 0 12px #c6ff3d88}
.ring{flex:none}
.seg3{grid-template-columns:repeat(3,1fr)!important}
.grade{display:inline-grid;place-items:center;min-width:28px;height:28px;padding:0 6px;border-radius:9px;font-weight:900;font-size:15px;color:#0b0c0e;background:var(--g);box-shadow:0 0 10px color-mix(in srgb,var(--g) 40%,transparent);vertical-align:middle}
.grade.big{min-width:54px;height:54px;font-size:30px;border-radius:16px}
.wdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px;text-align:center}
.wd{background:#121418;border-radius:12px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:4px}
.wd.tod{outline:1px solid var(--acc)}
.rk{display:flex;align-items:center;gap:10px;min-height:50px;padding:6px 0;border-top:1px solid #23272e;width:100%;text-align:left;font-size:15px}
.rk:first-of-type{border-top:0}
.rk b{white-space:nowrap}
.rk.dimr{opacity:.45}
.rkn{width:28px;height:28px;border-radius:9px;background:#23272e;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.rkn.gold{background:linear-gradient(135deg,#ffe27a,#d9a514);color:#1a1404}
.tag{font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:8px;background:#23272e;color:var(--muted);letter-spacing:0;text-transform:none}
.tag.opt{color:var(--c)}
.achs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ach{background:#121418;border:1px solid #23272e;border-radius:16px;padding:10px 8px;text-align:center;min-height:118px}
.ach .achi{width:40px;height:40px;margin:0 auto 6px;border-radius:12px;display:grid;place-items:center;background:#1b1e23;color:#4a505a}
.ach.got{border-color:#4b5d22;background:linear-gradient(180deg,#1d2512,#121418)}
.ach.got .achi{background:linear-gradient(135deg,#ffe27a,#c6ff3d);color:#151a08;box-shadow:0 0 14px #c6ff3d55}
.acht{font-weight:800;font-size:13px;line-height:1.2}
.achd{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.25}
.achp{height:5px;border-radius:3px;background:#23272e;margin-top:6px;overflow:hidden}.achp i{display:block;height:100%;background:var(--acc)}
.exic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none;color:#0b0c0e}
.exic .ic{width:22px;height:22px}
.exic.sm{width:36px;height:36px;border-radius:11px}.exic.sm .ic{width:18px;height:18px}
.cat-pull{background:linear-gradient(135deg,#4fd1ff,#2a8fd1)}.cat-push{background:linear-gradient(135deg,#ff9a6e,#e2563c)}.cat-core{background:linear-gradient(135deg,#c6ff3d,#7dbb12)}
.cat-legs{background:linear-gradient(135deg,#b896ff,#7b55e0)}.cat-fore{background:linear-gradient(135deg,#ffd54a,#e0a512)}.cat-arm{background:linear-gradient(135deg,#ff7db4,#d93f86)}.cat-hs{background:linear-gradient(135deg,#7dfcd8,#1fb98f)}.cat-food{background:linear-gradient(135deg,#ffb54a,#e08a12)}
/* упражнение */
.ex{border-top:1px solid #23272e;padding:16px 0}
.ex:first-of-type{border-top:0;padding-top:4px}
.exh{display:flex;align-items:center;gap:12px}
.ex .nm{font-weight:800;font-size:18px;line-height:1.2}
.ex .meta{margin:6px 0 0}
.ex .meta .pill{font-size:13px;padding:4px 10px}
.ib{width:46px;height:46px;border-radius:14px;background:#1d2025;border:1px solid #2a2e35;display:grid;place-items:center;color:var(--acc);flex:none}
.vid{display:flex;align-items:center;gap:12px;margin-top:12px;background:#121418;border:1px solid #23272e;border-radius:16px;padding:8px;color:inherit;text-decoration:none}
.vth{position:relative;width:112px;height:63px;border-radius:10px;overflow:hidden;flex:none;background:linear-gradient(135deg,#2a1414,#1d2025)}
.vth img{width:100%;height:100%;object-fit:cover;display:block}
.vpl{position:absolute;inset:0;display:grid;place-items:center}
.vpl .ic{width:34px;height:34px;padding:8px;border-radius:50%;background:rgba(255,40,40,.92);color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.5)}
.vt{display:block;font-weight:700;font-size:14.5px;line-height:1.25}
.valt{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:13.5px;color:var(--p);text-decoration:none;font-weight:700;min-height:36px}

/* ========== УТИЛИТЫ ========== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function fmt(n,d=0){if(n==null||isNaN(n))return '—';const m=Math.pow(10,d);const v=Math.round(n*m)/m;return String(v).replace('.',',').replace('-','−')}

const today=()=>dkey(now());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};

/* ========== ТРЕНИРОВКИ ========== */

 hollow:s=>({id:'hollow',name:'Hollow',sets:s,reps:'20–40 сек',rest:'30–45 сек',how:'Поясница прижата к полу, лопатки оторваны, руки и ноги вытянуты.'}),

const WEEK={
 1:{title:'Тяга, бицепс, кор',focus:'Сначала тяга и бицепс',noun:'тягу',blocks:[

     {id:'krow',name:'Тяга гири в наклоне',sets:4,reps:'8–12',rest:'90 сек',how:'Спина ровная, тянуть локоть к поясу.'},
     {id:'rc',name:'Обратные сгибания с гантелями',sets:4,reps:'10–15',rest:'60–75 сек',how:'Хват сверху (ладони вниз), локти у корпуса. Поднимай гантели сгибанием в локтях, кисти не заламывай, вниз медленно. Нет гантелей — резинка или рюкзак/сумка с грузом.'},
     {id:'bic',name:'Сгибания на бицепс',sets:4,reps:'8–12',rest:'75–90 сек',how:'Локти не уводить вперёд, вниз медленно.'}]},
   {id:'core',title:'Кор',ex:[X.hollow(4),X.plank(3),X.knees(),X.side(3)]},

 2:{title:'Днём предплечья и короткий кор, вечером БЖЖ 1,5 часа',focus:'Днём предплечья и кор, вечером БЖЖ',noun:'предплечья и кор',bjj:true,blocks:[

     {id:'close',name:'Отжимания узким хватом',sets:3,reps:'по максимуму',rest:'60–75 сек',how:'Локти вдоль корпуса, тело в линию.'}]},
   {id:'hs',title:'Стойка у стены',pikeOnly:true,ex:[{id:'hs',name:'Стойка у стены',sets:5,reps:'20–60 сек',rest:'60 сек',how:'Руки прямые, тело в линию, взгляд между кистей.'}]},

 4:{title:'Предплечья по самочувствию, вечером БЖЖ 1,5 часа',focus:'Вечером БЖЖ, предплечья по самочувствию',bjj:true,blocks:[

function blocksFor(dow){return WEEK[dow].blocks.filter(b=>!b.pikeOnly||S.pikeEasy)}
function trainStat(k){
 const dow=parseKey(k).getDay(),W=WEEK[dow],D=day(k,false);
 let reqSets=0,doneSets=0,reqEx=0,doneEx=0,optSets=0,optDone=0,next=null;
 for(const b of blocksFor(dow))for(const e of b.ex){
  const arr=D.sets[b.id+'.'+e.id]||[];const dn=arr.filter(Boolean).length;
  if(b.optional){optSets+=e.sets;optDone+=Math.min(dn,e.sets);continue}
  reqSets+=e.sets;doneSets+=Math.min(dn,e.sets);reqEx++;if(dn>=e.sets)doneEx++;
  else if(!next)next={b,e,dn};
 }
 const comps=[];if(reqSets)comps.push(doneSets/reqSets);if(W.bjj)comps.push(D.bjj?1:0);comps.push(D.steps?1:0);
 const score=comps.reduce((a,b)=>a+b,0)/comps.length;
 const trainingDone=(reqSets||W.bjj)?((reqSets?doneSets>=reqSets:true)&&(W.bjj?D.bjj:true)):false;
 return{dow,W,D,reqSets,doneSets,reqEx,doneEx,optSets,optDone,next,score,trainingDone};
}
function foodScore(t){const T=S.targets;
 const kc=t.kcal<=T.kcal[2]?Math.min(t.kcal/T.kcal[1],1):Math.max(0,1-(t.kcal-T.kcal[2])/500);
 return (kc+Math.min(t.p/T.p[1],1))/2}
function dayScore(k){return (foodScore(totals(k))+trainStat(k).score)/2}
function streak(){
 let n=0,d=now();if(dayScore(today())>0.7)n++;
 d=addDays(d,-1);
 for(let i=0;i<730;i++){const k=dkey(d);if(!S.days[k]||dayScore(k)<=0.7)break;n++;d=addDays(d,-1)}
 return n}

function planState(k){
 const D=day(k,false);
 return S.plan.map(it=>{
  const p=prod(it.pid),alt=it.alt?prod(it.alt):null;
  let eaten=0,usedAlt=false;
  for(const e of D.food){if(e.pid===it.pid)eaten+=e.amount;if(alt&&e.pid===it.alt){usedAlt=true;eaten+=e.amount}}
  const target=usedAlt?it.altAmount:it.amount;
  const left=Math.max(0,target-eaten);
  return{it,p,alt,usedAlt,eaten,target,left,done:left<=(p.unit==='шт'?0:5)};
 })}
function planTotals(){const t={kcal:0,p:0,f:0,c:0};for(const it of S.plan){const m=macroOf(prod(it.pid),it.amount);for(const x in t)t[x]+=m[x]}return t}
function mealGuess(){const h=now().getHours();if(h<11)return 'Завтрак';if(h<16)return 'Обед';if(h<22)return 'Ужин';return 'Другое'}
const SHORT={buck:'гречка',duck:'утка',tom:'помидоры',cuc:'огурцы',banana:'банан',apple:'яблоко'};
function nextMealText(k){
 const h=now().getHours(),ps=planState(k),R=remain(totals(k));
 const left=ps.filter(x=>!x.done);
 if(R.kcal<=0)return 'Дальше: ничего, калории закрыты. Голодно — огурцы и помидоры.';
 if(!left.length){const g=Math.round(Math.max(0,R.p)/0.22/10)*10;return R.p>10?`Дальше: план съеден, белка не хватает — утка ${g} г.`:'Дальше: план съеден. Остаток — овощи.'}
 // какие основные приёмы ещё впереди: не прошли по времени и ещё не записаны
 const MAIN=['Завтрак','Обед','Ужин'],logged=new Set(day(k,false).food.map(e=>e.meal));
 const cur=h<11?0:h<16?1:2;
 let ahead=MAIN.filter((m,i)=>i>=cur&&!logged.has(m));
 if(!ahead.length)ahead=['Ужин'];
 const mealsLeft=ahead.length,late=h>=21;
 const nm=late?'поздно — только белок':ahead[0].toLowerCase();
 const parts=[];
 if(late){
  const eg=ps.find(x=>x.it.pid==='egg'&&!x.done),du=ps.find(x=>x.it.pid==='duck'&&!x.done);
  let pr=Math.max(0,R.p);
  if(eg){parts.push(`яйца ${eg.left}`);pr-=eg.left*7}
  if(du&&pr>0)parts.push(`утка ${Math.min(du.left,Math.ceil(pr/0.22/10)*10)} г`);
  if(!parts.length)parts.push('огурцы и помидоры');
 } else for(const x of left){
  if(x.it.alt){if(mealsLeft<=2)parts.push('банан или яблоко');continue}
  let a=x.left/mealsLeft;
  if(x.p.unit==='шт')parts.push(`яйца ${Math.max(1,Math.round(a))}`);
  else{a=Math.max(10,Math.round(a/10)*10);parts.push(`${SHORT[x.p.id]||x.p.name.toLowerCase()} ${a} г${x.p.id==='buck'?' сухой':''}`)}
 }
 return `Дальше (${nm}): ${parts.slice(0,5).join(', ')}.`;
}

function dayPRs(k){const D=S.days[k];if(!D||!D.sv)return[];const res=[];const ids=new Set(Object.keys(D.sv).map(x=>x.split('.')[1]));
 for(const id of ids){const t=exInfo(id).type;const today=exHistory(id).find(h=>h.date===k);if(!today)continue;const prev=exHistory(id,k);if(!prev.length)continue;
  const bp=Math.max(...prev.map(h=>bestOf(h.sets,t).sc)),bt=bestOf(today.sets,t).sc;if(bt>bp)res.push(id)}
 return res}

const XPR={set:5,ex:10,train:50,bjj:40,steps:15,protein:25,kcal:25,water:10,creatine:5,weight:10,pr:20};

function dayXP0(k){
 const D=S.days[k],items=[];const add=(l,x)=>{if(x>0)items.push([l,x])};
 if(D){const ts=trainStat(k);let sets=0,exs=0;
  for(const b of blocksFor(ts.dow))for(const e of b.ex){const dn=(D.sets[b.id+'.'+e.id]||[]).slice(0,e.sets).filter(Boolean).length;sets+=dn;if(dn>=e.sets)exs++}
  add(`Подходы × ${sets}`,sets*XPR.set);add(`Упражнения × ${exs}`,exs*XPR.ex);
  if(ts.trainingDone&&(ts.reqSets||ts.W.bjj))add('Тренировка дня закрыта',XPR.train);
  if(ts.W.bjj&&D.bjj)add('БЖЖ 1,5 часа',XPR.bjj);
  if(D.steps)add('Шаги 8000–10000',XPR.steps);
  const t=totals(k),T=S.targets;
  if(t.p>=T.p[1])add('Белок закрыт',XPR.protein);
  if(t.kcal>=T.kcal[1]&&t.kcal<=T.kcal[2])add('Калории в коридоре',XPR.kcal);
  if(D.water>=2500)add('Вода 2,5 л',XPR.water);
  if(D.creatine)add('Креатин 5 г',XPR.creatine);
  const pr=dayPRs(k).length;add(`Рекорды × ${pr}`,pr*XPR.pr);
 }
 if(S.weights.some(w=>w.date===k))add('Вес утра записан',XPR.weight);
 return{total:items.reduce((a,x)=>a+x[1],0),items}}

function levelOf(x){let n=0;while(x>=needXP(n)){x-=needXP(n);n++}return{lvl:n,into:x,need:needXP(n)}}
const RANKS=[[0,'Новичок'],[1,'Ученик'],[3,'Боец'],[5,'Атлет'],[8,'Воин'],[12,'Мастер'],[16,'Элита'],[20,'Легенда']];

function mondayOf(d){const x=new Date(d);const w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);x.setHours(0,0,0,0);return x}
function weekStats(mon){const tk=today();let sum=0,n=0;const days=[];
 for(let i=0;i<7;i++){const k=dkey(addDays(mon,i));if(k>tk)break;const sc=S.days[k]?dayScore(k):0;sum+=sc;n++;days.push([k,sc])}
 return{mon:dkey(mon),avg:n?sum/n:0,n,days}}
function allWeeks(){const ks=Object.keys(S.days).filter(k=>k<=today()).sort();if(!ks.length)return[];
 const res=[];let m=mondayOf(parseKey(ks[0]));const end=mondayOf(now());
 while(m<=end){const w=weekStats(m);if(w.days.some(d=>S.days[d[0]]))res.push(w);m=addDays(m,7)}return res}

function gameStats(){return memo('gs',gameStats0)}
function gameStats0(){
 const ks=Object.keys(S.days).filter(k=>k<=today()).sort();const st={sets:0,trainings:0,protein:0,water:0,creatine:0,steps:0,bjj:0,prs:0,maxStreak:0,pStreak:0,hs:0,pull:0,weekS:false};
 let cur=0,pcur=0,prev=null;
 for(const k of ks){const D=S.days[k];const ts=trainStat(k),t=totals(k);
  for(const key in D.sets)st.sets+=(D.sets[key]||[]).filter(Boolean).length;
  if(ts.trainingDone&&ts.reqSets)st.trainings++;if(ts.W.bjj&&D.bjj)st.bjj++;
  const pOk=t.p>=S.targets.p[1];if(pOk)st.protein++;if(D.water>=2500)st.water++;if(D.creatine)st.creatine++;if(D.steps)st.steps++;
  st.prs+=dayPRs(k).length;
  const contig=prev&&dkey(addDays(parseKey(prev),1))===k;
  const good=dayScore(k)>0.7;cur=good?(contig?cur+1:1):0;st.maxStreak=Math.max(st.maxStreak,cur);
  pcur=pOk?(contig?pcur+1:1):0;st.pStreak=Math.max(st.pStreak,pcur);prev=k;
  if(D.sv)for(const key in D.sv){const id=key.split('.')[1];(D.sv[key]||[]).forEach((v,i)=>{if(!v||!(D.sets[key]||[])[i])return;if(id==='hs')st.hs=Math.max(st.hs,v.s||0);if(id==='pull')st.pull=Math.max(st.pull,v.r||0)})}
 }
 st.weighs=S.weights.length;st.weekS=allWeeks().some(w=>w.n===7&&grade(w.avg)==='S');
 st.lvl=levelOf(totalXP()).lvl;return st}

function weightChart(){
 const end=now(),start=addDays(end,-55),sk=dkey(start);
 const pts=S.weights.filter(w=>w.date>=sk).sort((a,b)=>a.date<b.date?-1:1);
 const W=362,H=170,pL=34,pR=8,pT=12,pB=24,ref=S.profile.morningRef;
 const vals=pts.map(p=>p.kg);
 const mn=Math.floor(Math.min(ref,...vals)-1),mx=Math.ceil(Math.max(ref,...vals)+1);
 const x=d=>pL+(parseKey(d)-parseKey(sk))/(864e5*55)*(W-pL-pR);
 const y=v=>pT+(mx-v)/(mx-mn)*(H-pT-pB);
 let g='';const step=(mx-mn)>6?2:1;
 for(let v=mn;v<=mx;v+=step)g+=`<line x1="${pL}" x2="${W-pR}" y1="${y(v)}" y2="${y(v)}" stroke="#23272e"/><text x="${pL-6}" y="${y(v)+4}" fill="#5c616a" font-size="11" text-anchor="end">${v}</text>`;
 for(let i=0;i<8;i+=2){const d=addDays(start,i*7);g+=`<text x="${x(dkey(d))}" y="${H-6}" fill="#5c616a" font-size="10.5">${d.getDate()}.${String(d.getMonth()+1).padStart(2,'0')}</text>`}
 g+=`<line x1="${pL}" x2="${W-pR}" y1="${y(ref)}" y2="${y(ref)}" stroke="#c6ff3d" stroke-opacity=".4" stroke-dasharray="4 5"/><text x="${W-pR}" y="${y(ref)-6}" fill="#c6ff3d" fill-opacity=".7" font-size="11" text-anchor="end">ориентир ${ref}</text>`;
 if(pts.length>1){const pp=pts.map(p=>x(p.date)+','+y(p.kg)).join(' ');g+=`<polygon fill="url(#wg)" points="${x(pts[0].date)},${H-pB} ${pp} ${x(pts[pts.length-1].date)},${H-pB}"/><polyline fill="none" stroke="#4fd1ff" stroke-width="2.5" stroke-linejoin="round" points="${pp}"/>`}
 g+=pts.map(p=>`<circle cx="${x(p.date)}" cy="${y(p.kg)}" r="3.5" fill="#4fd1ff"/>`).join('');
 let pace;
 if(pts.length>=2){const a=pts[0],b=pts[pts.length-1];const wk=(parseKey(b.date)-parseKey(a.date))/(864e5*7);
  if(wk>=1){const r=(b.kg-a.kg)/wk;pace=`<div class="sm" style="margin-top:6px">Темп: <b style="color:${r<=-0.2&&r>=-0.4?'var(--ok)':'var(--warn)'}">${r>0?'+':''}${fmt(r,2)} кг/нед</b> · ${pts.length} ${pl(pts.length,'запись','записи','записей')}</div>`}
  else pace=`<div class="sm mut" style="margin-top:6px">${pts.length} ${pl(pts.length,'запись','записи','записей')}. Темп будет виден через неделю.</div>`}
 else pace=`<div class="sm mut" style="margin-top:6px">${pts.length?'1 запись: '+fmt(pts[0].kg,1)+' кг. ':'Записей пока нет. '}Пунктир — ориентир из профиля (утро ≈${ref} кг).</div>`;
 return `<svg class="chart" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fd1ff" stop-opacity=".25"/><stop offset="1" stop-color="#4fd1ff" stop-opacity="0"/></linearGradient></defs>${g}</svg>${pace}`}

async function analyze(){
